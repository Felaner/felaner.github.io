name: Обновление данных

on:
  schedule:
    - cron: "0 3 * * *"   # каждый день в 03:00 UTC
  workflow_dispatch:       # и вручную: Actions → «Обновление данных» → Run workflow

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install beautifulsoup4 pillow

      - name: Обновить источники и пересобрать сайт
        run: python -X utf8 scraper/update.py

      - name: Отчёт
        if: always()
        run: |
          if [ -f scraper/source/update_report.md ]; then cat scraper/source/update_report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Закоммитить изменения
        run: |
          git add -A data e sitemap.xml index.html scraper/source
          if git diff --cached --quiet; then
            echo "Данные не изменились."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Автообновление данных $(date -u +%d.%m.%Y)" -m "$(head -n 6 scraper/source/update_report.md | tail -n 4)"
          git push
